# Experiment: simple Linear Regression run for every include=1 phenotype
# from info.csv that's present in all_z_scores_imputed.txt (currently
# BCT_BASO and BCT_EO). Leaving data.illness blank makes main.py
# auto-detect the phenotype list instead of enumerating it by hand.
#
# For each phenotype: predicts its own Z-score from every other phenotype
# column, restricted to its own clumped SNPs (output/clumped_<phenotype>.clumps)
# under p_clump.

construct_gwas_mri:
  run: false

gwas_phenotype_construction:
  run: false

phenotype_clumping:
  run: false

plink2:
  prepare: false

data:
  # illness blank -> auto-detected. With min_density set, the phenotype list is
  # taken from the density-frontier JSON (the same features used for clumping)
  # instead of info_csv_path; unset min_density to fall back to info.csv.
  illness: ["BCT_EO"]
  min_density: 0.8
  density_json: "./data/pipeline/analysis/dense_density.json"
  gwas_pheno_path: "./data/pipeline/input/gwas_pheno/all_z_scores_imputed.txt"
  info_csv_path: "./data/pipeline/input/gwas_pheno/info.csv"
  p_clump: [0.001]
  distribution: ["low"]
  target: Z
  # Feature-column pruning during sampling (drops sparse phenotype columns so the
  # complete-case matrix keeps rows). Use ONE of the following:
  #   min_complete_frac: auto-pick the densest features so that >= this fraction
  #                      of rows stay complete (takes precedence if both set).
  #   max_col_missing:   drop any feature column whose null-rate exceeds this.
  min_complete_frac: 0.95
  # max_col_missing: 0.05
  # Marginal |Pearson r| with the target. Applied twice, independently: inside
  # sampling (before the densest-feature selection above, reported under
  # sampling_metrics_*.target_correlation) and again on the loaded matrix before
  # training, so it holds with sampling: false too — reported at the result JSON
  # top level as target_correlation. Features above this floor are dropped;
  # set to null to disable both.
  max_target_corr: 0.8
  drop_missing: true   # then drop the residual rows with any null before training
  test_size: 0.2
  n_splits: 5
  save_splits: true
  polars: true
  chunk_size: 100000
  row_ratio: [1.0]
  col_ratio: [1.0]
  top_rows: true
  top_cols: true
  # min_complete_frac / max_col_missing only run inside the sampling stage; with
  # sampling: false the existing data/sampled/<dist>/sampled_<illness>_p<p>.txt is
  # reused as written. max_target_corr applies either way (see above).
  sampling: false
  invert: true

experiment:
  run: true

model:
  name: tabpfn
  type: ["regression"]
  finetune: false
  device: cpu

hpo:
  run: false

evaluation:
  metrics: [r2, mse, pearson_r2]
  binary_threshold: null


shap:
  enabled: true
  # interactions: false -> index "SV",    max_order 1  (plain Shapley values)
  # interactions: true  -> index "k-SII", max_order 2  (pairwise interactions)
  # index / max_order override those defaults (e.g. max_order: 3 for triples,
  # or index: FSII). Only the linear family and TabPFN are explained.
  interactions: true
  # index: k-SII
  # max_order: 2
  # Coalitions sampled per explained row. "auto" asks for the exhaustive
  # 2**n_features and caps it at max_budget; above the cap shapiq samples and
  # flags the result as estimated.
  budget: auto
  max_budget: 2048
  random_state: 0
  # Background rows the marginal imputer uses per coalition. Defaults to the
  # whole background (background_size); shapiq's own default of 100 resamples it
  # and leaves a per-feature offset that averaging cannot remove. Cost scales
  # with it, so background_size is the accuracy/cost dial.
  background_size: 100
  # imputer_sample_size: 100
  # Rows explained per fold (cost is per row). Drop the key to explain them all.
  max_explain_rows: 20
  # Values are averaged over a fold's test rows, then over the outer folds. The
  # summary lands in the result JSON under hpo.shap_mean_values; the averaged
  # object itself in results/<experiment>/shap/interaction_values_mean.json
  # (reload with shapiq.InteractionValues.from_json_file).
  plots: true
  max_display: 20
  # The beeswarm keeps the per-row values instead of an average: one dot per
  # explained sample, positioned by its signed attribution and coloured by its
  # feature value. Per fold it covers that fold's test rows; the across-fold one
  # pools them, which (the outer folds being disjoint) is one dot per sample.
  beeswarm_max_rows: 5000
  abbreviate_names: false
  # joblib workers for explaining a fold's rows. Leave unset (serial) for TabPFN.
  # n_jobs: -1
