# Experiment: Lasso Regression with HPO on every file in data/lucas.
# data.dir runs one separate experiment per file (bypassing the GWAS
# illness pipeline). Target column resolved per file via regex.

plink2:
  prepare: false

experiment:
  run: false

data:
  dir: "./data/lucas"
  target_regex: "_target$"
  ignore_columns: ["uniprot", "gene", "protein_variant"]

# Model settings
model:
  name: lasso
  type: ["regression"]  # Options: regression, binary_classification
  p_value_binary: 0.0001

# Hyperparameter optimization settings
hpo:
  run: true
  n_trials: 5
  outer_cv: 5
  inner_cv: 5
  search_space:
    alpha: [0.00001, 10000]

# Evaluation settings
evaluation:
  metrics: [r2, mse, pearson_r2]
  binary_threshold: null
