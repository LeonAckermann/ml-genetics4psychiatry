# Experiment: Residual DNN with HPO for the phenotypes not yet covered by
# residual_dnn_all_phenotypes.yaml (determined by diffing residual_dnn results
# in results_phenotype/ against the lasso_regression results, which cover the
# full density-selected phenotype list).
#
# For each phenotype: predicts its own Z-score from every other phenotype
# column, restricted to its own clumped SNPs (output/clumped_<phenotype>.clumps)
# under p_clump, dropping rows with any missing value before training.

construct_gwas_mri:
  run: false

gwas_phenotype_construction:
  run: false

phenotype_clumping:
  run: false

plink2:
  prepare: false

data:
  illness: [
    "BCT_RDW",
    "BCT_WBC",
    "BRADFIELDJP_CHILDOBESITY",
    "CARDIOGRAMPLUSC4D-META_CAD",
    "CARDIOGRAM_CHD",
    "COVID_HOSPITALCOVID",
    "COVID_SEVERECOVID",
    "DEMONTISD_ADHD",
    "FOLKERSENL_BNGF",
    "FOLKERSENL_CCL2",
    "FOLKERSENL_CCL3",
    "FOLKERSENL_CCL4",
    "FOLKERSENL_CXCL1",
    "FOLKERSENL_CXCL8",
    "FOLKERSENL_ECP",
    "GSCAN_CIG-DAY",
    "GSCAN_DRINK-WEEK",
    "GSCAN_SMOKE-CES",
    "GSCAN_SMOKE-INIT",
    "GUINTIVANOJ_PPD",
    "ICD_IPF",
    "ICGCUKB_COPD",
    "IMSGC-WTCC2_MULTSCLE",
    "IPFALLEN_IPF",
    "ISGEC_CHRONOTYPE",
  ]
  gwas_pheno_path: "./data/pipeline/input/gwas_pheno/all_z_scores_imputed.txt"
  info_csv_path: "./data/pipeline/input/gwas_pheno/info.csv"
  p_clump: [0.001]
  distribution: ["low"]
  target: Z
  drop_missing: true   # drop rows with any null feature/target before training
  test_size: 0.2
  n_splits: 5
  save_splits: true
  polars: true
  chunk_size: 100000
  row_ratio: [1.0]
  col_ratio: [1.0]
  top_rows: true
  top_cols: true
  sampling: false

experiment:
  run: true

model:
  name: residual_dnn
  type: ["regression"]
  p_value_binary: 0.0001

hpo:
  run: true
  n_trials: 30
  outer_cv: 5
  inner_cv: 5
  search_space:
    hidden_dim: [32, 128]
    n_layers: [1, 8]
    dropout: [0.1, 0.8]
    learning_rate: [1e-6, 1e-2]
    weight_decay: [0.0, 0.0001]
    batch_size: [16, 64]
    epochs: [20, 60]
    patience: [5, 20]

load_best_params: false

evaluation:
  metrics: [r2, mse, pearson_r2]
  binary_threshold: null
