# Experiment: Residual DNN with HPO for every density-selected phenotype.
# Mirrors ../pipeline/linear_regression_all_phenotypes.yaml (density-selected
# feature list, drop_missing, per-phenotype clumped-SNP sampling) but runs
# residual_dnn with the HPO search space from
# ../hpo/residual_dnn_hpo_regression.yaml.
#
# For each phenotype: predicts its own Z-score from every other phenotype
# column, restricted to its own clumped SNPs (output/clumped_<phenotype>.clumps)
# under p_clump, dropping rows with any missing value before training.

construct_gwas_mri:
  run: false

gwas_phenotype_construction:
  run: false

phenotype_clumping:
  run: false

plink2:
  prepare: false

data:
  # illness blank -> auto-detected. With min_density set, the phenotype list is
  # taken from the density-frontier JSON (the same features used for clumping)
  # instead of info_csv_path; unset min_density to fall back to info.csv.
  illness: []
  min_density: 0.8
  density_json: "./data/pipeline/analysis/dense_density.json"
  gwas_pheno_path: "./data/pipeline/input/gwas_pheno/all_z_scores_imputed.txt"
  info_csv_path: "./data/pipeline/input/gwas_pheno/info.csv"
  p_clump: [0.001]
  distribution: ["low"]
  min_complete_frac: 0.95
  max_target_corr: 0.8
  target: Z
  drop_missing: true   # drop rows with any null feature/target before training
  test_size: 0.2
  n_splits: 5
  save_splits: true
  polars: true
  chunk_size: 100000
  row_ratio: [1.0]
  col_ratio: [1.0]
  top_rows: true
  top_cols: true
  sampling: false
  invert: true

experiment:
  run: true

model:
  name: residual_dnn
  type: ["regression"]
  p_value_binary: 0.0001

hpo:
  run: true
  n_trials: 30
  outer_cv: 5
  inner_cv: 5
  search_space:
    hidden_dim: [32, 128]
    n_layers: [1, 8]
    dropout: [0.1, 0.8]
    learning_rate: [1.0e-6, 1.0e-2]    
    weight_decay: [0.0, 0.0001]
    batch_size: [16, 64]
    epochs: [20, 100]
    patience: [5, 20]


load_best_params: false

evaluation:
  metrics: [r2, mse, pearson_r2]
  binary_threshold: null

# Per-epoch train/test metrics on the OUTER fold (loss + accuracy for
# classification, loss + R² for regression), recorded for every outer fold and
# written to the result JSON under hpo.training_curves.
#   enabled: record the curves. Costs one extra eval pass over the outer train
#            and test splits per epoch; only affects epoch-based models
#            (residual_dnn, dnn, mdn) — sklearn/XGBoost/TabPFN have no epochs.
#   plots:   also render them to results/<experiment>/training/ —
#            fold_<k>.png per fold plus all_folds.png.
# The test curve is diagnostic only: early stopping and best-weight selection
# still use the separate validation split, so nothing leaks into training.
training_curves:
  enabled: true
  plots: true
  dir: training
