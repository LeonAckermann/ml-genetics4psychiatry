construct_gwas_mri:
  run: false
gwas_phenotype_construction:
  run: false
phenotype_clumping:
  run: false
plink2:
  prepare: false
data:
  illness:
  - UKBB-WANGX_VITAMIN-D
  - UKBB-WUY_GORD
  - UKBB-WUY_IBS
  - UKBB-WUY_PUD
  - UKBB-ZHUZ_HBP
  - UKBB-ZHUZ_RHR
  - UKPSC-INTIBD-INTPSC_CHOLANG
  - VALETTE_ASTHMA
  - VAN-HEEL_CELIAC
  - VGHRV_SDNN
  - VOGELEZANGS_CHILDBMI
  - WILLER_ATRIALFIBRI
  - WINKLERTW_WHRATIOFINF50
  - WINKLERTW_WHRATIOFSUP50
  - XUEA_T2D
  - ZHANGH_BREAST-CANCER
  - ZHUMENTAL_ADULTONSETASTHMA
  density_json: ./data/pipeline/analysis/dense_density.json
  gwas_pheno_path: ./data/pipeline/input/gwas_pheno/all_z_scores_imputed.txt
  info_csv_path: ./data/pipeline/input/gwas_pheno/info.csv
  p_clump:
  - 0.001
  distribution:
  - low
  target: Z
  min_complete_frac: 0.95
  max_target_corr: 0.8
  drop_missing: true
  test_size: 0.2
  n_splits: 5
  save_splits: true
  polars: true
  chunk_size: 100000
  row_ratio:
  - 1.0
  col_ratio:
  - 1.0
  top_rows: true
  top_cols: true
  sampling: false
  invert: true
experiment:
  run: true
model:
  name: tabpfn
  type:
  - regression
  p_value_binary: 0.0001
  finetune: false
  device: cuda
  epochs: 30
  learning_rate: 1e-5
hpo:
  run: true
  outer_cv: 5
evaluation:
  metrics:
  - r2
  - mse
  - pearson_r2
  binary_threshold: null
shap:
  enabled: true
  interactions: true
  budget: auto
  max_budget: 2048
  random_state: 0
  background_size: 100
  max_explain_rows: 200
  plots: true
  max_display: 20
