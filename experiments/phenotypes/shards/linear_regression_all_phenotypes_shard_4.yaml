construct_gwas_mri:
  run: false
gwas_phenotype_construction:
  run: false
phenotype_clumping:
  run: false
plink2:
  prepare: false
data:
  illness:
  - MAGIC_HBA1C1
  - MAGIC_HBA1C2
  - MAGIC_HOMA-B
  - MAGIC_HOMA-IR
  - MAGIC_IS
  - MEGASTROKE_AIS
  - MVP_ASTHMA
  - MVP_BLADDER-CANCER
  - MVP_BRAIN-CANCER
  - MVP_BRONCHIECTASIS
  - MVP_CD
  - MVP_CHF
  - MVP_CHRONIC-AIRWAY-OBSTRUCTION
  - MVP_CHRONIC-BRONCHITIS
  - MVP_COLON-CANCER
  - MVP_COLORECTAL-CANCER
  - MVP_COPD
  - MVP_COPDSELFREPORT
  - MVP_DEM
  - MVP_EMPHYSEMA
  - MVP_ESOPHAGUS-CANCER
  - MVP_ILD
  - MVP_INCONTINENCE
  - MVP_IPF
  - MVP_KIDNEY-CANCER
  density_json: ./data/pipeline/analysis/dense_density.json
  gwas_pheno_path: ./data/pipeline/input/gwas_pheno/all_z_scores_imputed.txt
  info_csv_path: ./data/pipeline/input/gwas_pheno/info.csv
  p_clump:
  - 0.001
  distribution:
  - low
  target: Z
  min_complete_frac: 0.95
  max_target_corr: 0.8
  drop_missing: true
  test_size: 0.2
  n_splits: 5
  save_splits: true
  polars: true
  chunk_size: 100000
  row_ratio:
  - 1.0
  col_ratio:
  - 1.0
  top_rows: true
  top_cols: true
  sampling: false
  invert: true
experiment:
  run: true
model:
  name: linear_regression
  type:
  - regression
hpo:
  run: false
evaluation:
  metrics:
  - r2
  - mse
  - pearson_r2
  binary_threshold: null
shap:
  enabled: true
  interactions: true
  budget: auto
  max_budget: 2048
  random_state: 0
  background_size: 100
  max_explain_rows: null
  plots: true
  max_display: 20
