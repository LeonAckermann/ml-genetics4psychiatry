construct_gwas_mri:
  run: false
gwas_phenotype_construction:
  run: false
phenotype_clumping:
  run: false
plink2:
  prepare: false
data:
  illness:
  - PGC_SCZ
  - PURDUEMP_RENAL-CANCER
  - RASHKINSR_CERVICAL-CANCER
  - RASHKINSR_ENDOM-CANCER
  - RASHKINSR_ES-CANCER
  - RASHKINSR_LL
  - RASHKINSR_MELANOMA
  - RASHKINSR_OCP-CANCER
  - RASHKINSR_OVARIAN-CANCER
  - RASHKINSR_RECTAL-CANCER
  - RA_RA
  - REPROGEN_AME
  - SHRINE_MODERATESEVEREASTHMA
  - SPIRO-UKB-SMALL_FEV1-FVC
  - SPIRO-UKB_FEV1
  - SPIRO-UKB_FEV1-FVC
  - SPIRO-UKB_FVC
  - SPIRO-UKB_PEF
  - SSGAC_COLLEGE
  - SSGAC_EDUYEAR
  - STROMNI_ANX
  - STROMNI_OCD
  - UKB-MOL_SODIUM
  - UKBB-SAIGE_BONE-CANCER
  - UKBB-SAIGE_EYE-CANCER
  density_json: ./data/pipeline/analysis/dense_density.json
  gwas_pheno_path: ./data/pipeline/input/gwas_pheno/all_z_scores_imputed.txt
  info_csv_path: ./data/pipeline/input/gwas_pheno/info.csv
  p_clump:
  - 0.001
  distribution:
  - low
  target: Z
  min_complete_frac: 0.95
  max_target_corr: 0.8
  drop_missing: true
  test_size: 0.2
  n_splits: 5
  save_splits: true
  polars: true
  chunk_size: 100000
  row_ratio:
  - 1.0
  col_ratio:
  - 1.0
  top_rows: true
  top_cols: true
  sampling: false
  invert: true
experiment:
  run: true
model:
  name: linear_regression
  type:
  - regression
hpo:
  run: false
evaluation:
  metrics:
  - r2
  - mse
  - pearson_r2
  binary_threshold: null
shap:
  enabled: true
  interactions: true
  budget: auto
  max_budget: 2048
  random_state: 0
  background_size: 100
  max_explain_rows: null
  plots: true
  max_display: 20
