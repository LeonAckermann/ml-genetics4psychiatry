construct_gwas_mri:
  run: false
gwas_phenotype_construction:
  run: false
phenotype_clumping:
  run: false
plink2:
  prepare: false
data:
  illness:
  - BCT_BASO
  - BCT_EO
  - BCT_HCT
  - BCT_HGB
  - BCT_LYMPH
  - BCT_MCH
  - BCT_MCHC
  - BCT_MCV
  - BCT_MONO
  - BCT_NEUT
  - BCT_RDW
  - BCT_WBC
  - BRADFIELDJP_CHILDOBESITY
  - CARDIOGRAMPLUSC4D-META_CAD
  - CARDIOGRAM_CHD
  - COVID_HOSPITALCOVID
  - COVID_SEVERECOVID
  - DEMONTISD_ADHD
  - FOLKERSENL_BNGF
  - FOLKERSENL_CCL2
  - FOLKERSENL_CCL3
  - FOLKERSENL_CCL4
  - FOLKERSENL_CXCL1
  - FOLKERSENL_CXCL8
  - FOLKERSENL_ECP
  density_json: ./data/pipeline/analysis/dense_density.json
  gwas_pheno_path: ./data/pipeline/input/gwas_pheno/all_z_scores_imputed.txt
  info_csv_path: ./data/pipeline/input/gwas_pheno/info.csv
  p_clump:
  - 0.001
  distribution:
  - low
  target: Z
  min_complete_frac: 0.95
  max_target_corr: 0.8
  drop_missing: true
  test_size: 0.2
  n_splits: 5
  save_splits: true
  polars: true
  chunk_size: 100000
  row_ratio:
  - 1.0
  col_ratio:
  - 1.0
  top_rows: true
  top_cols: true
  sampling: false
  invert: true
experiment:
  run: true
model:
  name: linear_regression
  type:
  - regression
hpo:
  run: false
evaluation:
  metrics:
  - r2
  - mse
  - pearson_r2
  binary_threshold: null
shap:
  enabled: true
  interactions: true
  budget: auto
  max_budget: 2048
  random_state: 0
  background_size: 100
  max_explain_rows: null
  plots: true
  max_display: 20
