# Experiment: TabPFN with HPO for every density-selected phenotype.
# Mirrors ../pipeline/linear_regression_all_phenotypes.yaml (density-selected
# feature list, drop_missing, per-phenotype clumped-SNP sampling) but runs
# tabpfn with the HPO setup from ../hpo/tabpfn_hpo_regression.yaml (TabPFN has
# no search space, so HPO is just the outer CV evaluation).
#
# For each phenotype: predicts its own Z-score from every other phenotype
# column, restricted to its own clumped SNPs (output/clumped_<phenotype>.clumps)
# under p_clump, dropping rows with any missing value before training.

construct_gwas_mri:
  run: false

gwas_phenotype_construction:
  run: false

phenotype_clumping:
  run: false

plink2:
  prepare: false

data:
  # illness blank -> auto-detected. With min_density set, the phenotype list is
  # taken from the density-frontier JSON (the same features used for clumping)
  # instead of info_csv_path; unset min_density to fall back to info.csv.
  illness: []
  min_density: 0.8
  density_json: "./data/pipeline/analysis/dense_density.json"
  gwas_pheno_path: "./data/pipeline/input/gwas_pheno/all_z_scores_imputed.txt"
  info_csv_path: "./data/pipeline/input/gwas_pheno/info.csv"
  p_clump: [0.001]
  distribution: ["low"]
  target: Z
  min_complete_frac: 0.95
  max_target_corr: 0.8
  drop_missing: true   # drop rows with any null feature/target before training
  test_size: 0.2
  n_splits: 5
  save_splits: true
  polars: true
  chunk_size: 100000
  row_ratio: [1.0]
  col_ratio: [1.0]
  top_rows: true
  top_cols: true
  sampling: false
  invert: true

experiment:
  run: true

model:
  name: tabpfn
  type: ["regression"]
  p_value_binary: 0.0001
  finetune: false
  device: mps
  epochs: 30
  learning_rate: 1e-5

hpo:
  run: true
  outer_cv: 5

evaluation:
  metrics: [r2, mse, pearson_r2]
  binary_threshold: null

shap:
  enabled: true
  # interactions: false -> index "SV",    max_order 1  (plain Shapley values)
  # interactions: true  -> index "k-SII", max_order 2  (pairwise interactions)
  # index / max_order override those defaults (e.g. max_order: 3 for triples,
  # or index: FSII). Only the linear family and TabPFN are explained.
  interactions: true
  index: FSII
  # max_order: 2
  # Coalitions sampled per explained row. "auto" asks for the exhaustive
  # 2**n_features and caps it at max_budget; above the cap shapiq samples and
  # flags the result as estimated.
  budget: auto
  max_budget: 2048
  random_state: 0
  background_size: 100
  # Rows explained per fold (cost is per row). Drop the key to explain them all.
  max_explain_rows: 
  # Values are averaged over a fold's test rows, then over the outer folds. The
  # summary lands in the result JSON under hpo.shap_mean_values; the averaged
  # object itself in results/<experiment>/shap/interaction_values_mean.json
  # (reload with shapiq.InteractionValues.from_json_file).
  plots: true
  max_display: 20