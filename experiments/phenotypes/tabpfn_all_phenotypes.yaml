# Experiment: TabPFN with HPO for every density-selected phenotype.
# Mirrors ../pipeline/linear_regression_all_phenotypes.yaml (density-selected
# feature list, drop_missing, per-phenotype clumped-SNP sampling) but runs
# tabpfn with the HPO setup from ../hpo/tabpfn_hpo_regression.yaml (TabPFN has
# no search space, so HPO is just the outer CV evaluation).
#
# For each phenotype: predicts its own Z-score from every other phenotype
# column, restricted to its own clumped SNPs (output/clumped_<phenotype>.clumps)
# under p_clump, dropping rows with any missing value before training.

construct_gwas_mri:
  run: false

gwas_phenotype_construction:
  run: false

phenotype_clumping:
  run: false

plink2:
  prepare: false

data:
  # illness blank -> auto-detected. With min_density set, the phenotype list is
  # taken from the density-frontier JSON (the same features used for clumping)
  # instead of info_csv_path; unset min_density to fall back to info.csv.
  illness: []
  min_density: 0.8
  density_json: "./data/pipeline/analysis/dense_density.json"
  gwas_pheno_path: "./data/pipeline/input/gwas_pheno/all_z_scores_imputed.txt"
  info_csv_path: "./data/pipeline/input/gwas_pheno/info.csv"
  p_clump: [0.001]
  distribution: ["low"]
  target: Z
  drop_missing: true   # drop rows with any null feature/target before training
  test_size: 0.2
  n_splits: 5
  save_splits: true
  polars: true
  chunk_size: 100000
  row_ratio: [1.0]
  col_ratio: [1.0]
  top_rows: true
  top_cols: true
  sampling: true

experiment:
  run: true

model:
  name: tabpfn
  type: ["regression"]
  p_value_binary: 0.0001
  finetune: false
  device: mps
  epochs: 30
  learning_rate: 1e-5

hpo:
  run: true
  outer_cv: 5

evaluation:
  metrics: [r2, mse, pearson_r2]
  binary_threshold: null
