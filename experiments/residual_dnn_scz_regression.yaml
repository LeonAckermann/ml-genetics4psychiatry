# Experiment: Residual DNN with Pre-loaded Best Parameters
# This config loads best parameters from the best_params/ folder
# and skips hyperparameter optimization entirely.

construct_gwas_mri:
  run: false

plink2:
  prepare: false

sampling:
  run: false

# Data settings
data:
  illness: ["SCZ"]
  p_clump: [0.01]
  distribution: ["low"]
  target: Z
  test_size: 0.2
  n_splits: 5
  save_splits: true
  polars: true
  chunk_size: 10000
  row_ratio: [0.1]
  col_ratio: [1]
  top_rows: true
  top_cols: true
  mri_p_value: 0.0001

experiment:
  run: true
  
# Model settings
model:
  name: residual_dnn
  hidden_dims: [128,128, 64, 64, 32, 32]
  output_dim: 1
  dropout: 0.4
  learning_rate: 0.00005
  epochs: 50
  batch_size: 32
  patience: 20
  type: "regression"
  p_value_binary: 0.00001


# Skip HPO and load best params from best_params folder
# Hyperparameter optimization settings
hpo:
  run: false
  n_trials: 30
  outer_cv: 5
  inner_cv: 5
  search_space:
    hidden_dim: [32, 128]
    n_layers: [1, 8]
    dropout: [0.1, 0.8]
    learning_rate: [1e-6, 1e-2]
    weight_decay: [0.0, 0.0001]
    batch_size: [16, 64]
    epochs: [20, 60]
    patience: [5, 20]

load_best_params: false

# Evaluation settings
evaluation:
  metrics: [r2, mse, pearson_r2]
  binary_threshold: null

# SHAP explanation settings (opt-in; off by default). When enabled, each outer
# fold's final model is explained on its test set and plots are written to
# results/<experiment>/shap/fold_<k>/.
shap:
  enabled: false
  background_size: 100          # rows sampled from the fold's training data as SHAP background
  max_display: 20                # top-N features shown in summary/bar plots
  dependence_features: []        # feature names to plot, or "all" for every feature. [] = skip
  dependence_dpi: 50              # low-resolution dpi for dependence plots
  waterfall_observations: []      # test-set row indices (per fold) to plot. [] = skip
  force_stacked: true             # set false to skip the stacked force plot entirely
  force_stacked_max_rows: 50       # cap on test-set rows composited into force_stacked.png
  permutation_max_evals: 500      # eval budget for the black-box fallback explainer
  tabpfn_budget: 128               # per-row coalition budget for TabPFN's shapiq explainer
