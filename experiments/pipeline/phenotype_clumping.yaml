# Experiment: LD-clump each auxiliary phenotype's own GWAS signal
# (from data/pipeline/input/gwas_pheno/all_z_scores_imputed.txt) independently.
#
# For each include=1 phenotype in info.csv that has a column in the joined
# matrix, this derives a two-sided P-value from that phenotype's own Z-score
# and clumps it with plink2, writing:
#   - data/pipeline/intermediate/aligned_<phenotype>.txt   (ID, P)
#   - data/pipeline/output/clumped_<phenotype>.clumps      (plink2 clump output)
#
# create_final is left false on purpose: with many phenotypes, materializing
# a merged 'final' file per phenotype doesn't scale. Instead, the downstream
# experimental pipeline loads data/pipeline/input/gwas_pheno directly at
# train time, filtered to a given phenotype's own clumped SNPs
# (dataloader.preprocess.load_phenotype_clumped_data / sample(gwas_pheno_path=...)).

construct_gwas_mri:
  run: false

gwas_phenotype_construction:
  run: false

phenotype_clumping:
  run: true
  # phenotypes: [BCT_BASO, BCT_EO]   # optional explicit list; omit to auto-detect
  gwas_pheno_path: "./data/pipeline/input/gwas_pheno/all_z_scores_imputed.txt"
  info_csv_path: "./data/pipeline/input/gwas_pheno/info.csv"
  ref: "./data/pipeline/input/ref_panel/All_ensemble_1000G_hg38_EUR_all_chr"
  p_clump: 1
  r2: 0.05
  clump_kb: 500
  create_final: false

plink2:
  prepare: false

experiment:
  run: false

sampling:
  run: false

# Data settings (unused for this prepare-only run, kept for schema compatibility)
data:
  illness: BCT_EO
  target: Z
  test_size: 0.2
  n_splits: 10
  save_splits: true

model:
  name: linear_regression

evaluation:
  metrics: [r2, mse]
  binary_threshold: null
