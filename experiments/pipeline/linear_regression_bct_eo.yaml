# Experiment: simple Linear Regression predicting BCT_EO's own Z-score from
# the other phenotype columns in all_z_scores_imputed.txt, restricted to
# BCT_EO's own clumped SNPs (output/clumped_BCT_EO.clumps) under p_clump.
#
# Exercises dataloader.preprocess.sample(gwas_pheno_path=...) ->
# load_phenotype_clumped_data(), i.e. loads straight from
# input/gwas_pheno/all_z_scores_imputed.txt filtered to clumped_BCT_EO.clumps
# SNPs with P <= p_clump, with the BCT_EO column renamed to Z.

construct_gwas_mri:
  run: false

gwas_phenotype_construction:
  run: false

phenotype_clumping:
  run: false

plink2:
  prepare: false

data:
  illness: ["BCT_EO"]
  p_clump: [0.001]
  distribution: ["low"]
  target: Z
  test_size: 0.2
  n_splits: 5
  save_splits: true
  polars: true
  chunk_size: 100000
  row_ratio: [1.0]
  col_ratio: [1.0]
  top_rows: true
  top_cols: true
  sampling: true
  gwas_pheno_path: "./data/pipeline/input/gwas_pheno/all_z_scores_imputed.txt"

experiment:
  run: true

model:
  name: linear_regression
  type: ["regression"]

hpo:
  run: false

evaluation:
  metrics: [r2, mse, pearson_r2]
  binary_threshold: null
