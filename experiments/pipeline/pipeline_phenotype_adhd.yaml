# Experiment: align ADHD GWAS with the joint cross-illness phenotype Z-score
# matrix (data/pipeline/input/gwas_pheno/all_z_scores.txt) instead of the MRI
# Z-score matrix. Mirrors pipeline_adhd.yaml but uses output_suffix so the
# intermediate/final files don't collide with the MRI-based ADHD run.

plink2:
  prepare: true
  p_clump: 1
  r2: 0.05
  clump_kb: 500
  #total_chunks: 5
  chunk_size: 100000
  mri: "./data/pipeline/input/gwas_pheno/all_z_scores.txt"
  output_suffix: "_phenotype"
  ref: "./data/pipeline/input/ref_panel/All_ensemble_1000G_hg38_EUR_all_chr"
  aligned: "./data/pipeline/intermediate/aligned_ADHD_phenotype.txt"
  output: "./data/pipeline/output/clumped_ADHD_phenotype"
  polars: true

experiment:
  run: false

sampling:
  run: false

# Data settings
data:
  illness: ADHD
  target: Z_scores_ADHD
  test_size: 0.2
  n_splits: 10
  save_splits: true

# Model settings
model:
  name: linear_regression    # Options: linear_regression, dnn, baseline

# Evaluation settings
evaluation:
  metrics: [r2, mse]
  binary_threshold: null      # Set to a number (e.g. 0 or 1) to also compute classification metrics
