construct_gwas_mri:
  run: false

plink2:
  prepare: false

sampling:
  run: false

data:
  illness: ["SCZ", "BIP", "MDD", "OCD", "AZ", "ADHD"]
  p_clump: [0.0001]
  distribution: ["low_high"]
  target: Z
  test_size: 0.2
  n_splits: 5
  save_splits: true
  polars: true
  chunk_size: 10000
  row_ratio: [1]
  col_ratio: [1]
  top_rows: true
  top_cols: true
  mri_p_value: 0.0001

experiment:
  run: false

model:
  name: mdn
  type: ["binary_classification"]
  p_value_binary: 0.0001
  number_of_components: 2
  hidden_dim: 100
  n_layers: 2
  dropout: 0.6
  learning_rate: 0.000005
  weight_decay: 0.00001
  batch_size: 64
  epochs: 300
  patience: 20

hpo:
  run: false

load_best_params: false

evaluation:
  metrics: [accuracy, balanced_accuracy, f1]
  binary_threshold: null
  confidence_threshold: 0.6
